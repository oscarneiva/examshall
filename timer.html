<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Run up to 16 exam countdowns side by side, with reading time, 30 and 5 minute warnings and extra time. Supports any exam boards.">
    <link rel="canonical" href="https://examshall.com/timer.html">
    <meta name="theme-color" content="#000000">

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Exams Hall">
    <meta property="og:url" content="https://examshall.com/timer.html">
    <meta property="og:title" content="Exam Timer - Exams Hall">
    <meta property="og:description" content="Run up to 16 exam countdowns side by side, with reading time, 30 and 5 minute warnings and extra time. Supports any exam boards.">
    <meta property="og:image" content="https://examshall.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Exams Hall">
    <meta name="twitter:card" content="summary_large_image">
    <title>Timer - Exams Hall</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #fff;
            color: #000;
            min-height: 100vh;
        }

        /* Setup overlay */
        #setup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #setup-overlay.hidden {
            display: none;
        }

        .setup-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 40px;
            width: 440px;
            max-width: 90vw;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .setup-card h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 28px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1.05rem;
            color: #000;
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: #555;
        }

        .form-group input[type="color"] {
            padding: 4px;
            height: 44px;
            cursor: pointer;
        }

        .form-group label.checkbox-inline {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .form-group label.checkbox-inline:last-child {
            margin-bottom: 0;
        }

        .form-group input[type="checkbox"] {
            width: auto;
            padding: 0;
            border: none;
        }

        .extra-time-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .extra-time-row label.checkbox-inline {
            margin-bottom: 0;
        }

        .extra-percent {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #333;
        }

        .extra-percent input {
            width: 80px;
            text-align: center;
        }

        .extra-percent input:disabled {
            background: #f5f5f5;
            color: #aaa;
            cursor: not-allowed;
        }

        .duration-row {
            display: flex;
            gap: 10px;
        }

        .duration-row input {
            flex: 1;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-primary {
            background: #000;
            color: #fff;
            width: 100%;
            margin-top: 8px;
        }

        .btn-link {
            background: none;
            color: #555;
            font-size: 0.95rem;
            text-decoration: underline;
            padding: 8px 0;
            width: 100%;
            text-align: center;
            cursor: pointer;
            border: none;
            margin-top: 4px;
        }

        .btn-link:hover {
            color: #000;
        }

        .setup-cancel {
            background: none;
            color: #999;
            font-size: 0.9rem;
            text-decoration: underline;
            padding: 8px 0;
            width: 100%;
            text-align: center;
            cursor: pointer;
            border: none;
            margin-top: 2px;
            display: none;
        }

        .setup-cancel:hover {
            color: #000;
        }

        /* Timer view */
        #timer-view {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 30px 40px 80px;
            flex-direction: column;
            align-items: center;
        }

        #timer-view.active {
            display: flex;
        }

        .timer-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .current-time-label {
            font-size: 1.1rem;
            color: #777;
            margin-bottom: 4px;
        }

        .current-time {
            font-size: 4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        /* Card grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 24px;
            width: 100%;
        }

        .exam-card {
            container-type: inline-size;
            border: 4px solid;
            border-radius: 14px;
            padding: 28px 32px;
            position: relative;
            cursor: grab;
            user-select: none;
            transition: box-shadow 0.2s, opacity 0.2s;
        }

        .exam-card.dragging {
            opacity: 0.4;
            box-shadow: none;
        }

        .exam-card.drag-over {
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.2);
        }

        .exam-card:active {
            cursor: grabbing;
        }

        .exam-card.ib {
            border-color: #1a56db;
        }

        .exam-card.igcse {
            border-color: #dc2626;
        }

        .exam-card.custom {
            border-color: var(--accent);
        }

        .card-actions {
            position: absolute;
            top: 10px;
            right: 14px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .card-remove {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #bbb;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
        }

        .card-remove:hover {
            color: #666;
        }

        .card-edit {
            background: none;
            border: none;
            color: #bbb;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
        }

        .card-edit:hover {
            color: #666;
        }

        .card-edit svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        .exam-name {
            font-size: clamp(1.4rem, 14cqi, 3.5rem);
            font-weight: 700;
            line-height: 1.15;
            text-align: center;
            overflow-wrap: break-word;
            margin-bottom: 2px;
        }

        .exam-board-label {
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .exam-card.ib .exam-board-label {
            color: #1a56db;
        }

        .exam-card.igcse .exam-board-label {
            color: #dc2626;
        }

        .exam-card.custom .exam-board-label {
            color: var(--accent);
        }

        .exam-duration-label {
            font-size: 1.1rem;
            color: #777;
            text-align: center;
            margin-bottom: 10px;
        }

        .time-rows {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 18px;
            border-radius: 6px;
            transition: background-color 0.3s, color 0.3s;
        }

        .time-row .label {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .time-row .value {
            font-size: 1.2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .time-row.highlighted-ib {
            background: #1a56db;
            color: #fff;
        }

        .time-row.highlighted-igcse {
            background: #dc2626;
            color: #fff;
        }

        .time-row.highlighted-custom {
            background: var(--accent);
            color: #fff;
        }

        /* Inline-editable primary time: reading for IB, start for IGCSE/Custom */
        .start-edit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 4px 18px;
            border-radius: 6px;
            transition: background-color 0.3s, color 0.3s;
        }

        .start-edit-row .label {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .start-edit-row.highlighted-ib {
            background: #1a56db;
            color: #fff;
        }

        .start-edit-row.highlighted-igcse {
            background: #dc2626;
            color: #fff;
        }

        .start-edit-row.highlighted-custom {
            background: var(--accent);
            color: #fff;
        }

        .start-edit-input {
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            width: auto;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 6px;
            padding: 1px 6px;
            background: #fff;
            color: #000;
            outline: none;
            transition: border-color 0.2s;
        }

        .start-edit-input:focus {
            border-color: #888;
        }

        .countdown-section {
            margin-top: 10px;
            text-align: center;
        }

        .countdown-status {
            font-size: 2.0rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .exam-card.ib .countdown-status {
            color: #1a56db;
        }

        .exam-card.igcse .countdown-status {
            color: #dc2626;
        }

        .exam-card.custom .countdown-status {
            color: var(--accent);
        }

        .countdown-time {
            display: inline-block;
            font-size: clamp(2.4rem, 23cqi, 7.5rem);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            padding: 4px 14px;
            border-radius: 8px;
            transition: background-color 0.3s, color 0.3s;
        }

        .exam-card.ib .countdown-time {
            color: #1a56db;
        }

        .exam-card.igcse .countdown-time {
            color: #dc2626;
        }

        .exam-card.custom .countdown-time {
            color: var(--accent);
        }

        .exam-card.ib .countdown-time.highlighted-ib {
            background: #1a56db;
            color: #fff;
        }

        .exam-card.igcse .countdown-time.highlighted-igcse {
            background: #dc2626;
            color: #fff;
        }

        .exam-card.custom .countdown-time.highlighted-custom {
            background: var(--accent);
            color: #fff;
        }

        /* Add timer button (inside grid) */
        .add-card {
            border: 3px dashed #ddd;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .add-card:hover {
            border-color: #aaa;
            background: #fafafa;
        }

        .add-card-content {
            text-align: center;
            color: #aaa;
        }

        .add-card-content .plus {
            font-size: 3rem;
            font-weight: 300;
            line-height: 1;
        }

        .add-card-content .add-label {
            font-size: 1.1rem;
            margin-top: 6px;
        }

        /* Toast popup */
        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 32px 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            z-index: 200;
            text-align: center;
            max-width: 400px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
        }

        #toast.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        #toast-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 199;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #toast-backdrop.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #toast p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #333;
            margin-bottom: 20px;
        }

        #toast button {
            background: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 28px;
            font-size: 1rem;
            cursor: pointer;
        }

        #toast button:hover {
            opacity: 0.85;
        }

        /* Bottom controls */
        .bottom-controls {
            position: fixed;
            bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .btn-bottom {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 0.95rem;
            color: #555;
            cursor: pointer;
        }

        .btn-bottom:hover {
            background: #eee;
            color: #000;
        }

        /* Hidden file input */
        #file-input {
            display: none;
        }

        /* GitHub link */
        .github-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #bbb;
            line-height: 0;
            z-index: 150;
            transition: color 0.2s;
        }

        .github-link:hover {
            color: #000;
        }

        .github-link svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        /* Responsive: small desktops / large tablets -> 3 columns */
        @media (max-width: 1100px) {
            .cards-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        /* Responsive: tablets (iPad portrait) -> 2 columns */
        @media (max-width: 820px) {
            .cards-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* Responsive: phones -> single column */
        @media (max-width: 560px) {
            #timer-view {
                padding: 24px 16px 96px;
            }

            .timer-header {
                margin-bottom: 24px;
            }

            .current-time {
                font-size: 3rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .exam-card {
                padding: 22px 22px;
            }

            .setup-card {
                padding: 28px 24px;
            }

            .github-link svg {
                width: 34px;
                height: 34px;
            }
        }
    </style>
</head>
<body>
    <!-- Setup overlay -->
    <div id="setup-overlay">
        <div class="setup-card">
            <h1 id="setup-title">Exam Timer</h1>
            <div class="form-group">
                <label for="exam-board">Exam Board</label>
                <select id="exam-board">
                    <option value="IB">IB</option>
                    <option value="IGCSE">IGCSE</option>
                    <option value="Custom">Custom</option>
                </select>
            </div>
            <div class="form-group" id="custom-warnings-group">
                <label>Warnings</label>
                <label class="checkbox-inline"><input type="checkbox" id="custom-30min" checked> 30 min warning</label>
                <label class="checkbox-inline"><input type="checkbox" id="custom-5min" checked> 5 min warning</label>
            </div>
            <div class="form-group" id="custom-color-group">
                <label for="custom-color">Border Color</label>
                <input type="color" id="custom-color" value="#7c3aed">
            </div>
            <div class="form-group">
                <label for="exam-name">Exam Name</label>
                <input type="text" id="exam-name" placeholder="e.g. English A Paper 1 HL">
            </div>
            <div class="form-group">
                <label>Duration</label>
                <div class="duration-row">
                    <input type="number" id="duration-hours" min="0" max="5" placeholder="Hours" value="1">
                    <input type="number" id="duration-minutes" min="0" max="59" placeholder="Minutes" value="30">
                </div>
            </div>
            <div class="form-group">
                <label>Extra Time</label>
                <div class="extra-time-row">
                    <label class="checkbox-inline"><input type="checkbox" id="extra-time-enabled" checked> Show extra time</label>
                    <span class="extra-percent">
                        <input type="number" id="extra-percent" min="1" max="200" value="25">
                        <span>%</span>
                    </span>
                </div>
            </div>
            <div class="form-group">
                <label for="start-time" id="start-time-label">Start Time (24-hour, HH:MM)</label>
                <input type="text" id="start-time" inputmode="numeric" maxlength="5" placeholder="HH:MM" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" lang="en-GB">
            </div>
            <button class="btn btn-primary" id="btn-start">Add Timer</button>
            <button class="btn btn-primary" id="btn-load">Load Timer</button>
            <button class="setup-cancel" id="btn-cancel">Cancel</button>
            <input type="file" id="file-input" accept=".json">
        </div>
    </div>

    <!-- Timer view -->
    <div id="timer-view">
        <div class="timer-header">
            <div class="current-time-label">Current Time</div>
            <div class="current-time" id="current-time">--:--:--</div>
        </div>

        <div class="cards-grid" id="cards-grid">
            <!-- Exam cards and add-card injected by JS -->
        </div>

        <div class="bottom-controls">
            <button class="btn btn-primary" id="btn-download">Save Timer</button>
        </div>
    </div>

    <!-- GitHub link -->
    <a class="github-link" href="https://github.com/oscarneiva" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile" title="GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
    </a>

    <!-- Toast popup -->
    <div id="toast-backdrop"></div>
    <div id="toast">
        <p>Click on <strong>Save Timer</strong> to download your session in case of a shutdown.</p>
        <button id="toast-dismiss">OK</button>
    </div>

    <script>
        // State
        const timers = []; // array of { id, board, name, durationMin, startMin, times, el }
        let tickInterval = null;
        let nextId = 0;
        let editingTimerId = null; // id of the timer being edited via the setup overlay, or null when adding
        let hasUnsavedChanges = false;
        const MAX_TIMERS = 16;
        const DEFAULT_CUSTOM_COLOR = '#7c3aed';
        const DEFAULT_EXTRA_PERCENT = 25;

        // DOM refs
        const setupOverlay = document.getElementById('setup-overlay');
        const timerView = document.getElementById('timer-view');
        const cardsGrid = document.getElementById('cards-grid');
        const btnCancel = document.getElementById('btn-cancel');
        const setupTitle = document.getElementById('setup-title');
        const btnStart = document.getElementById('btn-start');
        const btnLoad = document.getElementById('btn-load');
        const btnDownload = document.getElementById('btn-download');

        // Track whether there are changes not yet saved via "Save Timer"
        function markDirty() {
            hasUnsavedChanges = true;
            btnDownload.style.display = '';
        }

        function markSaved() {
            hasUnsavedChanges = false;
            btnDownload.style.display = 'none';
        }

        // Form refs
        const examBoardSelect = document.getElementById('exam-board');
        const examNameInput = document.getElementById('exam-name');
        const durationHoursInput = document.getElementById('duration-hours');
        const durationMinutesInput = document.getElementById('duration-minutes');
        const startTimeInput = document.getElementById('start-time');
        const customWarningsGroup = document.getElementById('custom-warnings-group');
        const customColorGroup = document.getElementById('custom-color-group');
        const custom30Input = document.getElementById('custom-30min');
        const custom5Input = document.getElementById('custom-5min');
        const customColorInput = document.getElementById('custom-color');
        const extraTimeEnabledInput = document.getElementById('extra-time-enabled');
        const extraPercentInput = document.getElementById('extra-percent');

        // Helpers
        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function minutesToHM(totalMin) {
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return h > 0 ? `${h}h${pad(m)}m` : `${m}m`;
        }

        function timeStrToMinutes(str) {
            const [h, m] = str.split(':').map(Number);
            return h * 60 + m;
        }

        function minutesToTimeStr(totalMin) {
            const h = Math.floor(totalMin / 60) % 24;
            const m = totalMin % 60;
            return `${pad(h)}:${pad(m)}`;
        }

        function nowSeconds() {
            const now = new Date();
            return now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        }

        function nowMinutes() {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
        }

        // Compute key times for a timer
        function computeTimes(board, startMin, durationMin, opts) {
            const times = [];
            const endMin = startMin + durationMin;
            const isIB = board === 'IB';

            if (isIB) {
                times.push({ key: 'reading', label: 'READING', time: startMin - 5 });
            }

            times.push({ key: 'start', label: 'START', time: startMin });

            if (opts.show30 && durationMin > 30) {
                times.push({ key: '30min', label: '30 MIN', time: endMin - 30 });
            }

            if (opts.show5 && durationMin > 5) {
                times.push({ key: '5min', label: '5 MIN', time: endMin - 5 });
            }

            times.push({ key: 'end', label: 'END', time: endMin });

            // Optional extra-time allowance, finishing after the normal end
            if (opts.showExtra) {
                const extraMin = Math.round(durationMin * opts.extraPercent / 100);
                times.push({ key: 'extratime', label: `EXTRA ${opts.extraPercent}%`, time: endMin + extraMin });
            }

            return times;
        }

        // Resolve the milestone options for a timer. IB always shows both warning rows,
        // IGCSE only the 5-min, Custom follows its own checkboxes; extra time is
        // user-controlled for every board.
        function resolveOptions(data) {
            const warnings = data.board === 'IB' ? { show30: true, show5: true }
                : data.board === 'IGCSE' ? { show30: false, show5: true }
                : { show30: !!data.show30Min, show5: !!data.show5Min };

            const percent = Number(data.extraPercent);
            return {
                ...warnings,
                // Timers saved before extra time was optional have no flag, so keep showing it
                showExtra: data.showExtraTime !== false,
                extraPercent: percent > 0 ? percent : DEFAULT_EXTRA_PERCENT
            };
        }

        // Show the setup form: pass a timer to edit it, or omit to add a new one
        function showSetup(timer) {
            editingTimerId = timer ? timer.id : null;

            if (timer) {
                examBoardSelect.value = timer.board;
                examNameInput.value = timer.name;
                durationHoursInput.value = Math.floor(timer.durationMin / 60);
                durationMinutesInput.value = timer.durationMin % 60;
                // The field holds reading time for IB (start = reading + 5) and start time otherwise
                startTimeInput.value = minutesToTimeStr(timer.board === 'IB' ? timer.startMin - 5 : timer.startMin);
                custom30Input.checked = timer.show30Min !== false;
                custom5Input.checked = timer.show5Min !== false;
                customColorInput.value = timer.color || DEFAULT_CUSTOM_COLOR;
                extraTimeEnabledInput.checked = timer.showExtraTime !== false;
                extraPercentInput.value = timer.extraPercent || DEFAULT_EXTRA_PERCENT;
            } else {
                examNameInput.value = '';
                durationHoursInput.value = '1';
                durationMinutesInput.value = '30';
                const now = new Date();
                startTimeInput.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
                examBoardSelect.value = 'IB';
                custom30Input.checked = true;
                custom5Input.checked = true;
                customColorInput.value = DEFAULT_CUSTOM_COLOR;
                extraTimeEnabledInput.checked = true;
                extraPercentInput.value = DEFAULT_EXTRA_PERCENT;
            }

            setupTitle.textContent = timer ? 'Edit Timer' : 'Exam Timer';
            btnStart.textContent = timer ? 'Save Changes' : 'Add Timer';
            btnLoad.style.display = timer ? 'none' : '';
            updateCustomFieldsVisibility();
            updateStartTimeLabel();
            updateExtraPercentState();

            // Show cancel button if timers already exist (or always, when editing)
            btnCancel.style.display = (timer || timers.length > 0) ? 'block' : 'none';

            setupOverlay.classList.remove('hidden');
        }

        // The percentage only applies when extra time is switched on
        function updateExtraPercentState() {
            extraPercentInput.disabled = !extraTimeEnabledInput.checked;
        }

        // Show/hide the Custom-board-only fields based on the current selection
        function updateCustomFieldsVisibility() {
            const isCustom = examBoardSelect.value === 'Custom';
            customWarningsGroup.style.display = isCustom ? '' : 'none';
            customColorGroup.style.display = isCustom ? '' : 'none';
        }

        // For IB the single time field is the reading time (start = reading + 5 min)
        const startTimeLabel = document.getElementById('start-time-label');
        function updateStartTimeLabel() {
            startTimeLabel.textContent = examBoardSelect.value === 'IB'
                ? 'Reading Time (24-hour, HH:MM)'
                : 'Start Time (24-hour, HH:MM)';
        }

        // Build a card DOM element for a timer
        function buildCard(timer) {
            const card = document.createElement('div');
            card.className = 'exam-card ' + (timer.board === 'IB' ? 'ib' : timer.board === 'IGCSE' ? 'igcse' : 'custom');
            if (timer.board === 'Custom') {
                card.style.setProperty('--accent', timer.color || DEFAULT_CUSTOM_COLOR);
            }
            card.dataset.timerId = timer.id;
            card.draggable = true;

            // Prevent drag when interacting with buttons/inputs
            card.addEventListener('mousedown', (e) => {
                if (e.target.closest('button, input')) {
                    card.draggable = false;
                }
            });
            card.addEventListener('mouseup', () => { card.draggable = true; });

            // Top-right actions: edit (opens the setup overlay pre-filled for this timer), then remove
            const cardActions = document.createElement('div');
            cardActions.className = 'card-actions';

            const editBtn = document.createElement('button');
            editBtn.className = 'card-edit';
            editBtn.title = 'Edit timer';
            editBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" />
                </svg>
            `;
            editBtn.addEventListener('click', () => showSetup(timer));
            cardActions.appendChild(editBtn);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'card-remove';
            removeBtn.textContent = '\u00d7';
            removeBtn.addEventListener('click', () => removeTimer(timer.id));
            cardActions.appendChild(removeBtn);

            card.appendChild(cardActions);

            // Header (the board label is omitted for Custom exams)
            if (timer.board !== 'Custom') {
                const boardLabel = document.createElement('div');
                boardLabel.className = 'exam-board-label';
                boardLabel.textContent = timer.board;
                card.appendChild(boardLabel);
            }

            const nameLabel = document.createElement('div');
            nameLabel.className = 'exam-name';
            nameLabel.textContent = timer.name;
            card.appendChild(nameLabel);

            const durLabel = document.createElement('div');
            durLabel.className = 'exam-duration-label';
            durLabel.textContent = minutesToHM(timer.durationMin);
            card.appendChild(durLabel);

            // Time rows
            card.appendChild(buildTimeRows(timer));

            // Countdown
            const countdownSection = document.createElement('div');
            countdownSection.className = 'countdown-section';
            countdownSection.innerHTML = `
                <div class="countdown-status"></div>
                <div class="countdown-time">--:--</div>
            `;
            card.appendChild(countdownSection);

            timer.el = card;
            return card;
        }

        // Build the time-rows element. The board's primary time — reading for IB,
        // start for IGCSE/Custom — is an inline-editable input; the rest are plain rows.
        function buildTimeRows(timer) {
            const rowsContainer = document.createElement('div');
            rowsContainer.className = 'time-rows';

            const editableKey = timer.board === 'IB' ? 'reading' : 'start';

            timer.times.forEach(t => {
                const row = document.createElement('div');
                row.dataset.key = t.key;

                if (t.key === editableKey) {
                    row.className = 'start-edit-row';
                    row.innerHTML = `
                        <span class="label">${t.label}</span>
                        <input type="text" inputmode="numeric" maxlength="5" size="5" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" placeholder="HH:MM" class="start-edit-input" value="${minutesToTimeStr(t.time)}">
                    `;

                    const editInput = row.querySelector('.start-edit-input');
                    editInput.addEventListener('input', autoColon);
                    editInput.addEventListener('change', () => {
                        if (!/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(editInput.value)) {
                            // Invalid entry: revert to the current value
                            const cur = timer.times.find(x => x.key === t.key);
                            editInput.value = minutesToTimeStr(cur.time);
                            return;
                        }
                        const newTime = timeStrToMinutes(editInput.value);
                        // For IB the editable row is the reading time; the exam starts 5 min later
                        timer.startMin = timer.board === 'IB' ? newTime + 5 : newTime;
                        timer.times = computeTimes(timer.board, timer.startMin, timer.durationMin, resolveOptions(timer));
                        rebuildTimeRows(timer);
                        markDirty();
                    });
                } else {
                    row.className = 'time-row';
                    row.innerHTML = `
                        <span class="label">${t.label}</span>
                        <span class="value">${minutesToTimeStr(t.time)}</span>
                    `;
                }

                rowsContainer.appendChild(row);
            });

            return rowsContainer;
        }

        // Swap in freshly built rows after an inline time edit
        function rebuildTimeRows(timer) {
            timer.el.querySelector('.time-rows').replaceWith(buildTimeRows(timer));
        }

        // Render the add-timer placeholder card
        function renderAddCard() {
            const existing = cardsGrid.querySelector('.add-card');
            if (existing) existing.remove();

            if (timers.length < MAX_TIMERS) {
                const addCard = document.createElement('div');
                addCard.className = 'add-card';
                addCard.innerHTML = `
                    <div class="add-card-content">
                        <div class="plus">+</div>
                        <div class="add-label">Add Timer</div>
                    </div>
                `;
                addCard.addEventListener('click', () => showSetup());
                cardsGrid.appendChild(addCard);
            }
        }

        // Add a timer
        function addTimer(data) {
            if (timers.length >= MAX_TIMERS) {
                alert('Maximum of ' + MAX_TIMERS + ' timers reached.');
                return;
            }

            const opts = resolveOptions(data);

            const timer = {
                id: nextId++,
                board: data.board,
                name: data.name,
                durationMin: data.durationMin,
                startMin: data.startMin,
                show30Min: data.show30Min,
                show5Min: data.show5Min,
                color: data.color,
                showExtraTime: opts.showExtra,
                extraPercent: opts.extraPercent,
                times: computeTimes(data.board, data.startMin, data.durationMin, opts),
                el: null
            };

            timers.push(timer);
            const card = buildCard(timer);

            // Insert before add-card placeholder
            const addCard = cardsGrid.querySelector('.add-card');
            if (addCard) {
                cardsGrid.insertBefore(card, addCard);
            } else {
                cardsGrid.appendChild(card);
            }

            renderAddCard();

            // Show timer view, hide setup
            setupOverlay.classList.add('hidden');
            timerView.classList.add('active');

            // Start tick if not running
            if (!tickInterval) {
                tick();
                tickInterval = setInterval(tick, 1000);
            }

            // Show save reminder on first timer
            if (timers.length === 1) {
                showToast();
            }

            markDirty();
        }

        // Update an existing timer's details and rebuild its card in place
        function updateTimer(id, data) {
            const timer = timers.find(t => t.id === id);
            if (!timer) return;

            const opts = resolveOptions(data);

            timer.board = data.board;
            timer.name = data.name;
            timer.durationMin = data.durationMin;
            timer.startMin = data.startMin;
            timer.show30Min = data.show30Min;
            timer.show5Min = data.show5Min;
            timer.color = data.color;
            timer.showExtraTime = opts.showExtra;
            timer.extraPercent = opts.extraPercent;
            timer.times = computeTimes(data.board, data.startMin, data.durationMin, opts);

            const oldEl = timer.el;
            const newCard = buildCard(timer);
            oldEl.replaceWith(newCard);

            setupOverlay.classList.add('hidden');
            markDirty();
        }

        // Toast popup
        function showToast() {
            document.getElementById('toast').classList.add('visible');
            document.getElementById('toast-backdrop').classList.add('visible');
        }

        function hideToast() {
            document.getElementById('toast').classList.remove('visible');
            document.getElementById('toast-backdrop').classList.remove('visible');
        }

        // Remove a timer
        function removeTimer(id) {
            const idx = timers.findIndex(t => t.id === id);
            if (idx === -1) return;
            const timer = timers[idx];
            timer.el.remove();
            timers.splice(idx, 1);

            renderAddCard();

            // If no timers left, go back to setup
            if (timers.length === 0) {
                clearInterval(tickInterval);
                tickInterval = null;
                timerView.classList.remove('active');
                showSetup();
                markSaved();
            } else {
                markDirty();
            }
        }

        // Tick: update current time and all timer cards
        function tick() {
            const now = new Date();
            document.getElementById('current-time').textContent =
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

            const currentMin = nowMinutes();
            const currentSec = nowSeconds();

            timers.forEach(timer => {
                const highlightClass = timer.board === 'IB' ? 'highlighted-ib'
                    : timer.board === 'IGCSE' ? 'highlighted-igcse'
                    : 'highlighted-custom';
                const rowsContainer = timer.el.querySelector('.time-rows');
                const rows = rowsContainer.children;

                // Determine whether a milestone has been reached, and whether one
                // is being hit during the current minute
                let currentIdx = -1;
                let activeMilestoneIdx = -1;
                timer.times.forEach((t, i) => {
                    if (currentMin >= t.time) currentIdx = i;
                    if (currentMin === t.time) activeMilestoneIdx = i;
                });

                // Countdown
                const statusEl = timer.el.querySelector('.countdown-status');
                const countdownEl = timer.el.querySelector('.countdown-time');

                const endTime = timer.times.find(t => t.key === 'end');
                const startTime = timer.times.find(t => t.key === 'start');
                const readingTime = timer.times.find(t => t.key === 'reading');
                const extraTime = timer.times.find(t => t.key === 'extratime');

                const endSec = endTime.time * 60;
                const startSec = startTime.time * 60;
                const readingSec = readingTime ? readingTime.time * 60 : null;
                const finalSec = extraTime ? extraTime.time * 60 : endSec;

                // Highlight: the milestone row during its minute, then the remaining time
                timer.times.forEach((t, i) => {
                    if (rows[i]) rows[i].classList.remove('highlighted-ib', 'highlighted-igcse', 'highlighted-custom');
                });
                countdownEl.classList.remove('highlighted-ib', 'highlighted-igcse', 'highlighted-custom');

                if (activeMilestoneIdx >= 0) {
                    // A milestone is being hit this minute — highlight its row
                    if (rows[activeMilestoneIdx]) {
                        rows[activeMilestoneIdx].classList.add(highlightClass);
                    }
                } else if (currentIdx >= 0 && currentSec < finalSec) {
                    // After the milestone's minute, highlight the remaining time
                    countdownEl.classList.add(highlightClass);
                }

                if (currentSec >= finalSec) {
                    statusEl.textContent = 'EXAM ENDED';
                    countdownEl.textContent = '00:00';
                } else if (currentSec >= endSec) {
                    statusEl.textContent = 'Extra Time';
                    const rem = finalSec - currentSec;
                    const rh = Math.floor(rem / 3600);
                    const rm = Math.floor((rem % 3600) / 60);
                    const rs = rem % 60;
                    countdownEl.textContent = rh > 0
                        ? `${pad(rh)}:${pad(rm)}:${pad(rs)}`
                        : `${pad(rm)}:${pad(rs)}`;
                } else if (currentSec >= startSec) {
                    statusEl.textContent = 'Time Remaining';
                    const rem = endSec - currentSec;
                    const rh = Math.floor(rem / 3600);
                    const rm = Math.floor((rem % 3600) / 60);
                    const rs = rem % 60;
                    countdownEl.textContent = rh > 0
                        ? `${pad(rh)}:${pad(rm)}:${pad(rs)}`
                        : `${pad(rm)}:${pad(rs)}`;
                } else if (readingSec !== null && currentSec >= readingSec) {
                    statusEl.textContent = 'Reading Time';
                    const rem = startSec - currentSec;
                    const rm = Math.floor(rem / 60);
                    const rs = rem % 60;
                    countdownEl.textContent = `${pad(rm)}:${pad(rs)}`;
                } else {
                    const waitTarget = readingSec !== null ? readingSec : startSec;
                    statusEl.textContent = 'Waiting to Start';
                    const rem = waitTarget - currentSec;
                    const rh = Math.floor(rem / 3600);
                    const rm = Math.floor((rem % 3600) / 60);
                    const rs = rem % 60;
                    countdownEl.textContent = rh > 0
                        ? `${pad(rh)}:${pad(rm)}:${pad(rs)}`
                        : `${pad(rm)}:${pad(rs)}`;
                }
            });
        }

        // --- Event listeners ---

        // Add timer from form
        document.getElementById('btn-start').addEventListener('click', () => {
            const board = examBoardSelect.value;
            const name = examNameInput.value.trim() || 'Unnamed Exam';
            const hours = parseInt(durationHoursInput.value) || 0;
            const minutes = parseInt(durationMinutesInput.value) || 0;
            const durationMin = hours * 60 + minutes;

            if (!/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(startTimeInput.value)) {
                alert(board === 'IB'
                    ? 'Please enter a valid reading time (24-hour, HH:MM, 00:00 to 23:59).'
                    : 'Please enter a valid start time (24-hour, HH:MM, 00:00 to 23:59).');
                return;
            }
            const enteredMin = timeStrToMinutes(startTimeInput.value);
            // For IB the field is the reading time; the exam itself starts 5 min later
            const startMin = board === 'IB' ? enteredMin + 5 : enteredMin;

            if (durationMin <= 0) {
                alert('Please enter a valid duration.');
                return;
            }

            const extraPercent = parseInt(extraPercentInput.value);
            if (extraTimeEnabledInput.checked && !(extraPercent > 0)) {
                alert('Please enter an extra time percentage greater than 0.');
                return;
            }

            const data = { board, name, durationMin, startMin };
            data.showExtraTime = extraTimeEnabledInput.checked;
            data.extraPercent = extraPercent;
            if (board === 'Custom') {
                data.show30Min = custom30Input.checked;
                data.show5Min = custom5Input.checked;
                data.color = customColorInput.value;
            }

            if (editingTimerId !== null) {
                updateTimer(editingTimerId, data);
                editingTimerId = null;
            } else {
                addTimer(data);
            }
        });

        // Keep the Custom-only fields and the time field's label in sync with the board selection
        examBoardSelect.addEventListener('change', () => {
            updateCustomFieldsVisibility();
            updateStartTimeLabel();
        });

        // Grey out the percentage field while extra time is switched off
        extraTimeEnabledInput.addEventListener('change', updateExtraPercentState);

        // Auto-insert the ":" while typing a time (e.g. 1005 -> 10:05)
        function autoColon(e) {
            let digits = e.target.value.replace(/\D/g, '').slice(0, 4);
            if (digits.length >= 3) {
                digits = digits.slice(0, 2) + ':' + digits.slice(2);
            }
            e.target.value = digits;
        }
        startTimeInput.addEventListener('input', autoColon);

        // Cancel button (go back to timer view)
        btnCancel.addEventListener('click', () => {
            setupOverlay.classList.add('hidden');
            editingTimerId = null;
        });

        // Load button
        document.getElementById('btn-load').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    let data = JSON.parse(evt.target.result);

                    // Support both single timer and array format
                    if (!Array.isArray(data)) data = [data];

                    // Clear existing timers
                    timers.forEach(t => t.el.remove());
                    timers.length = 0;
                    renderAddCard();

                    data.forEach(d => {
                        if (d.board && d.name && d.durationMin && d.startMin !== undefined) {
                            addTimer(d);
                        }
                    });

                    if (timers.length === 0) {
                        alert('No valid timers found in file.');
                        showSetup();
                    } else {
                        // Freshly loaded timers already match the file on disk
                        markSaved();
                    }
                } catch {
                    alert('Could not read timer file.');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // Download button
        document.getElementById('btn-download').addEventListener('click', () => {
            if (timers.length === 0) return;
            const saveData = timers.map(t => {
                const entry = { board: t.board, name: t.name, durationMin: t.durationMin, startMin: t.startMin };
                entry.showExtraTime = t.showExtraTime;
                entry.extraPercent = t.extraPercent;
                if (t.board === 'Custom') {
                    entry.show30Min = t.show30Min;
                    entry.show5Min = t.show5Min;
                    entry.color = t.color;
                }
                return entry;
            });
            const blob = new Blob([JSON.stringify(saveData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'timer.json';
            a.click();
            URL.revokeObjectURL(url);
            markSaved();
        });

        // --- Drag and drop reordering ---
        let draggedCard = null;

        cardsGrid.addEventListener('dragstart', (e) => {
            const card = e.target.closest('.exam-card');
            if (!card) { e.preventDefault(); return; }
            draggedCard = card;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });

        cardsGrid.addEventListener('dragend', (e) => {
            if (draggedCard) {
                draggedCard.classList.remove('dragging');
                draggedCard = null;
            }
            cardsGrid.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        });

        cardsGrid.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.exam-card');
            if (!target || target === draggedCard) return;
            cardsGrid.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            target.classList.add('drag-over');
        });

        cardsGrid.addEventListener('dragleave', (e) => {
            const target = e.target.closest('.exam-card');
            if (target) target.classList.remove('drag-over');
        });

        cardsGrid.addEventListener('drop', (e) => {
            e.preventDefault();
            const target = e.target.closest('.exam-card');
            if (!target || !draggedCard || target === draggedCard) return;
            target.classList.remove('drag-over');

            // Swap DOM positions
            const allCards = [...cardsGrid.querySelectorAll('.exam-card')];
            const dragIdx = allCards.indexOf(draggedCard);
            const dropIdx = allCards.indexOf(target);

            if (dragIdx < dropIdx) {
                cardsGrid.insertBefore(draggedCard, target.nextSibling);
            } else {
                cardsGrid.insertBefore(draggedCard, target);
            }

            // Sync timers array order to match DOM
            const newOrder = [...cardsGrid.querySelectorAll('.exam-card')].map(
                el => timers.find(t => t.id === Number(el.dataset.timerId))
            ).filter(Boolean);
            timers.length = 0;
            timers.push(...newOrder);
            markDirty();
        });

        // Toast dismiss
        document.getElementById('toast-dismiss').addEventListener('click', hideToast);
        document.getElementById('toast-backdrop').addEventListener('click', hideToast);

        // Initial state: show setup
        showSetup();
    </script>
</body>
</html>
