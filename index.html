<head>

    <meta name="theme-color" content="#000000">

    <!-- Open Graph / link previews -->

    <meta property="og:site_name" content="Exams Hall">
    <meta property="og:url" content="https://examshall.com/">
    <meta property="og:title" content="Exams Hall - Exam Timers & Incident Log for Invigilators">
    <meta property="og:description" content="Free exam timers and an incident log sheet for teachers. Run up to 16 countdowns at once for IB, IGCSE and any custom exams. No sign-up, nothing to install. Save timer session with just one click.">

    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #fff;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .landing {
            text-align: center;
            max-width: 560px;
            width: 100%;
        }

        .landing h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .landing .tagline {
            font-size: 1.2rem;
            color: #777;
            margin-bottom: 48px;
        }

        .landing-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 360px;
            margin: 0 auto;
        }

        .landing-btn {
            display: block;
            text-decoration: none;
            background: #000;
            color: #fff;
            border-radius: 8px;
            padding: 20px 28px;
            font-size: 1.25rem;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.1s;
        }

        .landing-btn:hover {
            opacity: 0.85;
        }

        .landing-btn:active {
            transform: translateY(1px);
        }

        .landing-btn.secondary {
            background: #fff;
            color: #000;
            border: 2px solid #000;
        }

        /* GitHub link */
        .github-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #bbb;
            line-height: 0;
            z-index: 150;
            transition: color 0.2s;
        }

        .github-link:hover {
            color: #000;
        }

        .github-link svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        /* Responsive: tablets */
        @media (max-width: 768px) {
            .landing h1 {
                font-size: 3.2rem;
            }
        }

        /* Responsive: phones */
        @media (max-width: 480px) {
            body {
                padding: 24px;
            }

            .landing h1 {
                font-size: 2.6rem;
            }

            .landing .tagline {
                font-size: 1.05rem;
                margin-bottom: 36px;
            }

            .landing-btn {
                font-size: 1.1rem;
                padding: 18px 22px;
            }

            .github-link svg {
                width: 34px;
                height: 34px;
            }
        }
    </style>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Exams Hall",
        "url": "https://examshall.com/",
        "description": "Free exam timers and an incident log sheet for teachers. Run up to 16 countdowns at once for IB, IGCSE and any custom exams.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any modern web browser",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        }
    }
    </script>
</head>
<body>

    <div class="landing">

        <p class="tagline">Exam timing and invigilation tools</p>
        <div class="landing-buttons">
            <a class="landing-btn" href="timer.html">Exam Timer</a>
            <a class="landing-btn secondary" href="incident-log.html">Incident Log Sheet</a>
        </div>
    </div>

</body>
</html>
